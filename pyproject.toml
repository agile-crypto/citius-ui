[project]
name = "citius-ui"
version = "0.0.0"
description = "Citius Console UI prototype"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "gradio>=5,<6",
  "pandas>=2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[project.scripts]
citius-ui-mock = "citius_ui.single_user_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citius_ui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/citius_ui/config.py", "tests/test_config.py"]
