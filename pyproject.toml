[project]
name = "citius-ui"
version = "0.0.0"
description = "Citius Console UI prototype"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "gradio>=5,<6",
  "pandas>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "citius-python-sdk",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.18,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.16,<0.17",
]

[tool.uv.sources]
citius-python-sdk = { path = "citius-python-sdk", editable = true }

[project.scripts]
citius-ui-mock = "citius_ui.single_user_app:main"
citius-ui = "citius_ui.main:main"
citius-ui-layout-mock = "citius_ui.workbench.mock_surface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citius_ui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/citius_ui/config.py",
  "src/citius_ui/actions",
  "src/citius_ui/history",
  "src/citius_ui/auth",
  "src/citius_ui/grpc_client",
  "src/citius_ui/workbench/actions.py",
  "src/citius_ui/workbench/history_view.py",
  "src/citius_ui/workbench/forms.py",
  "src/citius_ui/showcases",
  "tests/test_config.py",
  "tests/test_redaction.py",
  "tests/test_registry.py",
  "tests/test_history_store.py",
  "tests/test_artifacts.py",
  "tests/test_executor.py",
  "tests/test_sessions.py",
  "tests/test_workbench_actions.py",
  "tests/test_history_view.py",
  "tests/test_runbooks.py",
  "tests/test_oidc.py",
  "tests/test_forms.py",
]

[[tool.mypy.overrides]]
module = ["gradio.*", "citius_api.*", "citius_sdk.*", "grpc", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true
