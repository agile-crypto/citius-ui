[project]
name = "citius-ui"
version = "0.0.0"
description = "Citius Console UI prototype"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "gradio>=5,<6",
  "pandas>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.18,<2",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[project.scripts]
citius-ui-mock = "citius_ui.single_user_app:main"
citius-ui = "citius_ui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citius_ui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/citius_ui/config.py",
  "src/citius_ui/actions",
  "src/citius_ui/history",
  "src/citius_ui/auth",
  "tests/test_config.py",
  "tests/test_redaction.py",
  "tests/test_registry.py",
  "tests/test_history_store.py",
  "tests/test_artifacts.py",
  "tests/test_executor.py",
  "tests/test_sessions.py",
]

[[tool.mypy.overrides]]
module = ["gradio.*"]
ignore_missing_imports = true
