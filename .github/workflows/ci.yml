name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only the SDK is needed for the build; citius-server is skipped.
      - run: git submodule update --init --depth 1 citius-python-sdk
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Oldest supported version (requires-python, mypy and ruff targets).
          python-version: "3.11"
      - run: uv sync --extra dev --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      # - uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
